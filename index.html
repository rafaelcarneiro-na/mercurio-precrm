<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;
  --b:#185FA5;--bl:#E6F1FB;
  --r:#A32D2D;--rl:#FCEBEB;
  --a:#BA7517;--al:#FAEEDA;
  --gr:#F5F4F0;--bord:#E2E0D8;
  --t:#1A1A18;--t2:#6B6B67;--t3:#9A9991;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gr);color:var(--t);font-size:13px;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;color:var(--t)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center}
.ov.h{display:none}
.modal{background:#fff;border-radius:12px;padding:28px 32px;width:460px;max-width:95vw}
.modal h2{font-size:15px;font-weight:500;margin-bottom:6px}
.modal p{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:18px}
.fi{margin-bottom:12px}
.fi label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin-bottom:4px}
.fi input,.fi textarea{width:100%;border:1px solid var(--bord);border-radius:8px;padding:8px 10px;font-size:12px;outline:none}
.fi input:focus,.fi textarea:focus{border-color:var(--g)}
.fi textarea{resize:vertical;height:80px;font-size:11px}
.bp{background:var(--g);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:500;width:100%;margin-top:4px}
.bp:hover{background:var(--gd)}
.bs{background:#fff;color:var(--t);border:1px solid var(--bord);border-radius:8px;padding:8px 14px;font-size:12px}
.bs:hover{background:var(--gr)}
.modal-row{display:flex;gap:8px;margin-top:8px}
.sdrs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sdr-btn{border:1px solid var(--bord);border-radius:8px;padding:9px 18px;background:#fff;font-size:13px;transition:all .15s}
.sdr-btn:hover{border-color:var(--g);background:var(--gl)}
.sdr-btn.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:500}
/* HEADER */
.hdr{background:var(--g);height:52px;padding:0 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:14px;font-weight:600;color:#fff;flex:1}
.hdr-logo span{opacity:.65;font-weight:400;font-size:11px;margin-left:6px}
.sdr-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px 4px 5px}
.sdr-av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sdr-nm{color:#fff;font-size:12px;font-weight:500}
.sdr-ch{background:none;border:none;color:rgba(255,255,255,.7);font-size:11px}
.sdr-ch:hover{color:#fff}
.sync{display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);flex-shrink:0;transition:.3s}
.sdot.ok{background:#6EE7B7}
.sdot.err{background:#FCA5A5}
.slbl{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}
/* TABS */
.tabs{background:rgba(0,0,0,.15);display:flex;position:sticky;top:52px;z-index:99}
.tab-btn{padding:10px 22px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer}
.tab-btn:hover{color:rgba(255,255,255,.9)}
.tab-btn.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1)}
.tc{display:none}
.tc.on{display:block}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:12px 20px}
.stat{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:10px 14px}
.sval{font-size:22px;font-weight:500;line-height:1}
.slb{font-size:11px;color:var(--t2);margin-top:2px}
.stat.b .sval{color:var(--b)}.stat.a .sval{color:var(--a)}.stat.g .sval{color:var(--g)}.stat.r .sval{color:var(--r)}
/* FILTERS */
.fbar{background:#fff;border-bottom:1px solid var(--bord);padding:9px 20px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fbar select,.fbar input{border:1px solid var(--bord);border-radius:7px;padding:6px 9px;font-size:12px;outline:none;background:#fff}
.fbar select:focus,.fbar input:focus{border-color:var(--g)}
.fbar input{flex:1;min-width:140px}
.ftgl{padding:5px 11px;border:1px solid var(--bord);border-radius:7px;background:#fff;color:var(--t2);font-size:12px}
.ftgl.on{background:var(--gl);border-color:var(--g);color:var(--gd);font-weight:500}
.fcnt{font-size:11px;color:var(--t3);white-space:nowrap;margin-left:auto}
/* TABLE */
.twrap{margin:0 20px 24px;border-radius:12px;border:1px solid var(--bord);overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{background:#F9F8F5;padding:9px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bord);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #F0EDE6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF7}
tr.mine td{background:#F0FBF6}
tr.mine:hover td{background:#E5F7EF}
.sbadge{display:inline-flex;align-items:center;justify-content:space-between;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:none;width:100%;white-space:nowrap}
.sbadge .arr{font-size:9px;opacity:.55}
.snc{background:#F1EFE8;color:#44443F}
.sco{background:var(--bl);color:var(--b)}
.sde{background:var(--rl);color:var(--r)}
.sav{background:var(--gl);color:var(--gd)}
.smenu{position:absolute;top:calc(100% + 3px);left:0;background:#fff;border:1px solid var(--bord);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:50;min-width:140px;overflow:hidden}
.smenu button{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;font-size:12px}
.smenu button:hover{background:var(--gr)}
.smenu.h{display:none}
.swrap{position:relative}
.rsel{border:1px solid var(--bord);border-radius:7px;padding:4px 6px;width:100%;background:#fff;font-size:11px;outline:none}
.rsel:focus{border-color:var(--g)}
.rsel.mine{border-color:var(--g);background:var(--gl);color:var(--gd);font-weight:500}
.obs{border:1px solid transparent;border-radius:7px;padding:4px 6px;width:100%;resize:none;height:30px;font-size:11px;background:transparent;line-height:1.4}
.obs:hover{border-color:var(--bord);background:#fff}
.obs:focus{outline:none;border-color:var(--g);background:#fff;height:56px}
.pag{display:flex;gap:5px;align-items:center;justify-content:center;padding:12px;border-top:1px solid #F0EDE6;flex-wrap:wrap}
.pag button{border:1px solid var(--bord);border-radius:6px;padding:4px 9px;background:#fff;font-size:12px}
.pag button:hover{background:var(--gr)}
.pag button.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.pag button:disabled{opacity:.35;cursor:not-allowed}
.pag-info{font-size:11px;color:var(--t2);padding:0 5px}
.empty{text-align:center;padding:48px;color:var(--t2)}
.empty h3{font-size:15px;font-weight:500;margin-bottom:6px}
.toast{position:fixed;bottom:20px;right:20px;background:#1A1A18;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:300;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}
/* DICAS */
.dicas-wrap{max-width:900px;margin:0 auto;padding:24px 20px 48px}
.d-sec{background:#fff;border:1px solid var(--bord);border-radius:12px;margin-bottom:14px;overflow:hidden}
.d-hdr{padding:13px 20px;background:#F9F8F5;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.d-hdr h2{font-size:14px;font-weight:500;color:var(--t);flex:1;margin:0}
.d-chev{font-size:11px;color:var(--t3);transition:transform .2s}
.d-chev.open{transform:rotate(180deg)}
.d-body{display:none;padding:20px}
.d-body.open{display:block}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.dc{background:#F9F8F5;border-radius:8px;padding:14px 16px}
.dc h3{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.dc p,.dc li{font-size:13px;color:var(--t);line-height:1.65}
.dc ul{padding-left:16px}
.dc li{margin-bottom:4px}
.dc.g{border-left:3px solid var(--g)}
.dc.b{border-left:3px solid var(--b)}
.dc.a{border-left:3px solid var(--a)}
.dc.r{border-left:3px solid var(--r)}
.dc.gr{border-left:3px solid #888}
.sbox{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:14px 16px;margin-bottom:10px;position:relative}
.sbox h4{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.sbox pre{font-family:inherit;font-size:12px;color:var(--t);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.sbox .cps{position:absolute;top:10px;right:10px;background:none;border:1px solid var(--bord);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--t2)}
.sbox .cps:hover{background:var(--gr)}
.warn{background:var(--al);border-left:3px solid var(--a);border-radius:8px;padding:11px 15px;margin-bottom:12px;font-size:12px;color:#633806;line-height:1.6}
.info{background:var(--bl);border-left:3px solid var(--b);border-radius:8px;padding:11px 15px;margin-bottom:12px;font-size:12px;color:#0C447C;line-height:1.6}
.pill{display:inline-block;background:var(--gl);color:var(--gd);font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;margin:2px}
</style>
</head>
<body>

<!-- SDR MODAL -->
<div class="ov h" id="ov-sdr">
<div class="modal">
  <h2>&#128075; Quem é você?</h2>
  <p>Seu nome fica salvo neste navegador. Os outros SDRs verão quem está trabalhando cada lead.</p>
  <div class="sdrs" id="sdr-pick"></div>
  <div class="modal-row">
    <button class="bp" id="btn-ok-sdr" onclick="confirmSdr()" disabled style="flex:1">Entrar</button>
  </div>
</div>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">Mercúrio <span>Pre-CRM Prospecção BH</span></div>
  <div class="sdr-chip">
    <div class="sdr-av" id="h-av">?</div>
    <span class="sdr-nm" id="h-nm">—</span>
    <button class="sdr-ch" onclick="showSdr()">&#8597;</button>
  </div>
  <div class="sync">
    <div class="sdot" id="sdot"></div>
    <span class="slbl" id="slbl">conectando…</span>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn on" id="tab-leads" onclick="switchTab('leads')">&#128203; Leads (1.546)</button>
  <button class="tab-btn"    id="tab-dicas" onclick="switchTab('dicas')">&#128161; Dicas SDR</button>
</div>

<!-- TAB LEADS -->
<div class="tc on" id="tc-leads">

<!-- STATS -->
<div class="stats">
  <div class="stat">  <div class="sval" id="s-tot">—</div><div class="slb">Total</div></div>
  <div class="stat b"><div class="sval" id="s-meu">—</div><div class="slb">Meus</div></div>
  <div class="stat a"><div class="sval" id="s-con">—</div><div class="slb">Contatando</div></div>
  <div class="stat g"><div class="sval" id="s-ava">—</div><div class="slb">Avançaram</div></div>
  <div class="stat r"><div class="sval" id="s-dec">—</div><div class="slb">Declinaram</div></div>
  <div class="stat">  <div class="sval" id="s-liv">—</div><div class="slb">Sem resp.</div></div>
</div>

<!-- FILTERS -->
<div class="fbar">
  <select id="f-st" onchange="applyF()">
    <option value="">Todos os status</option>
    <option value="não contatado">Não contatado</option>
    <option value="contatando">Contatando</option>
    <option value="declinou">Declinou</option>
    <option value="avançou">Avançou</option>
  </select>
  <select id="f-tipo" onchange="applyF()">
    <option value="">Empresas + Pessoas</option>
    <option value="empresa">Empresas (Maps)</option>
    <option value="pessoa">Pessoas (Apollo)</option>
  </select>
  <select id="f-ca" onchange="applyF()"><option value="">Todas as categorias</option></select>
  <select id="f-re" onchange="applyF()">
    <option value="">Todos os SDRs</option>
    <option value="__livre">Sem responsável</option>
  </select>
  <select id="f-wa" onchange="applyF()">
    <option value="">Todos</option>
    <option value="SIM">Só WhatsApp / Email</option>
  </select>
  <input id="f-q" type="text" placeholder="Buscar nome, empresa…" oninput="applyF()">
  <button class="ftgl" id="btn-meus" onclick="toggleMeus()">Meus leads</button>
  <span class="fcnt" id="fcnt"></span>
</div>

<!-- TABLE -->
<div class="twrap">
  <table>
    <colgroup>
      <col style="width:34px"><col style="width:22%"><col style="width:13%">
      <col style="width:14%"><col style="width:108px"><col style="width:128px">
      <col><col style="width:72px">
    </colgroup>
    <thead>
      <tr>
        <th>#</th><th>Contato</th><th>Cat./Setor</th><th>Canais</th>
        <th>Responsável</th><th>Status</th><th>Observações</th><th>Atualizado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pag" id="pag"></div>
</div>

</div><!-- /tc-leads -->

<!-- TAB DICAS -->
<div class="tc" id="tc-dicas"></div>

<div class="toast" id="toast"></div>

<script>
const SDRs    = ['Simone','Rafael','Milena','Paloma','Sabrina','Diego','Marcelo'];
const STATUS  = ['não contatado','contatando','declinou','avançou'];
const SCLS    = {'não contatado':'snc','contatando':'sco','declinou':'sde','avançou':'sav'};
const SLBL    = {'não contatado':'Não contatado','contatando':'Contatando','declinou':'Declinou','avançou':'Avançou'};
const PER     = 50;

let db, unsub;
let leads=[], filtered=[], page=1, sdr='', meus=false, openMenu=null, pickedSDR='';

async function init() {
  sdr = ls('sdr') || '';
  updateHdrSDR();
  const cfg = FIREBASE_CONFIG;
  try {
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true });
    if (!sdr) { showSdr(); return; }
    await seedIfNeeded();
    subscribeLeads();
  } catch(ex) {
    setSS('erro: ' + ex.message, false);
  }
}

// AUTO-SEED
async function seedIfNeeded() {
  const marker = await db.collection('_meta').doc('seed').get().catch(()=>null);
  if (marker && marker.exists) return;
  const snap = await db.collection(COLECAO).limit(1).get().catch(()=>null);
  if (snap && !snap.empty) {
    db.collection('_meta').doc('seed').set({done:true}).catch(()=>{});
    return;
  }
  setSS('carregando ' + SEED_DATA.length + ' leads…', null);
  await db.collection('_meta').doc('seed').set({iniciado:new Date().toISOString(),total:SEED_DATA.length}).catch(()=>{});
  const BS = 400;
  let done = 0;
  for (let i=0; i<SEED_DATA.length; i+=BS) {
    const batch = db.batch();
    SEED_DATA.slice(i,i+BS).forEach(row => {
      batch.set(db.collection(COLECAO).doc(), {...row, status:'não contatado', responsavel:null, observacoes:'', updated_at:null, updated_by:null});
    });
    await batch.commit();
    done += Math.min(BS, SEED_DATA.length - i);
    setSS(done + '/' + SEED_DATA.length + ' importados…', null);
  }
  await db.collection('_meta').doc('seed').update({concluido:new Date().toISOString()}).catch(()=>{});
}

function subscribeLeads() {
  setSS('carregando…', null);
  if (unsub) unsub();
  unsub = db.collection(COLECAO).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const doc = {_id:ch.doc.id, ...ch.doc.data()};
      if (ch.type==='added') leads.push(doc);
      else if (ch.type==='modified') { const i=leads.findIndex(l=>l._id===doc._id); if(i!==-1) leads[i]=doc; else leads.push(doc); }
      else if (ch.type==='removed') leads=leads.filter(l=>l._id!==doc._id);
    });
    buildCatFilter();
    applyF();
    setSS('ao vivo', true);
  }, err => setSS('erro: '+err.message, false));
}

async function updateLead(id, changes) {
  changes.updated_at = new Date().toISOString();
  changes.updated_by = sdr;
  try {
    await db.collection(COLECAO).doc(id).update(changes);
    const i = leads.findIndex(l=>l._id===id);
    if (i!==-1) Object.assign(leads[i], changes);
    applyF();
    return true;
  } catch(ex) { toast('Erro: '+ex.message); return false; }
}

function applyF() {
  const fSt=gv('f-st'), fCa=gv('f-ca'), fRe=gv('f-re'),
        fWa=gv('f-wa'), fQ=gv('f-q').toLowerCase().trim(), fTipo=gv('f-tipo');
  filtered = leads.filter(l => {
    if (fSt && l.status!==fSt) return false;
    if (fTipo && l.tipo!==fTipo) return false;
    if (fCa && l.categoria!==fCa) return false;
    if (fRe==='__livre' && l.responsavel) return false;
    if (fRe && fRe!=='__livre' && l.responsavel!==fRe) return false;
    if (fWa==='SIM') {
      const hasContact = l.whatsapp==='SIM' || l.email;
      if (!hasContact) return false;
    }
    if (meus && l.responsavel!==sdr) return false;
    if (fQ) {
      const hay = [l.empresa,l.nome,l.cargo,l.email,l.categoria].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(fQ)) return false;
    }
    return true;
  });
  document.getElementById('fcnt').textContent = filtered.length.toLocaleString('pt-BR') + ' registros';
  page=1; renderTable(); renderStats();
}

function toggleMeus() {
  meus=!meus;
  document.getElementById('btn-meus').classList.toggle('on',meus);
  applyF();
}

function renderTable() {
  const tbody=document.getElementById('tbody');
  const start=(page-1)*PER, slice=filtered.slice(start,start+PER);
  if (!slice.length) {
    tbody.innerHTML='<tr><td colspan="8" class="empty"><h3>Nenhum lead encontrado</h3><p>Ajuste os filtros acima.</p></td></tr>';
    document.getElementById('pag').innerHTML=''; return;
  }
  tbody.innerHTML = slice.map((l,idx) => {
    const isMine = l.responsavel===sdr;
    const isPessoa = l.tipo==='pessoa';
    const tel164 = (l.telefone_e164||'').replace(/\D/g,'');
    const waUrl  = tel164 ? 'https://wa.me/'+tel164 : '';
    const sc = SCLS[l.status]||'snc';
    const sl = SLBL[l.status]||l.status;
    const upd = l.updated_at ? fmtDate(l.updated_at) : '';
    const updBy = l.updated_by ? '<div style="font-size:10px;color:var(--t2)">'+e(l.updated_by)+'</div>' : '';
    const rOpts = ['',...SDRs].map(s=>'<option value="'+s+'" '+(l.responsavel===s?'selected':'')+'>'+( s||'— ninguém')+'</option>').join('');

    let nomeHtml, catHtml, canalHtml;

    if (isPessoa) {
      nomeHtml = '<div style="font-weight:500;font-size:12px">'+e(l.nome||l.empresa)+'</div>'
               + (l.cargo ? '<div style="font-size:10px;color:var(--t2)">'+e(l.cargo)+'</div>' : '')
               + (l.empresa&&l.nome ? '<div style="font-size:10px;color:var(--t3)">'+e(l.empresa)+'</div>' : '')
               + (l.linkedin ? '<a href="'+l.linkedin+'" target="_blank" style="font-size:10px;color:var(--b)">&#128279; LinkedIn</a>' : '');
      catHtml  = '<div style="font-size:11px">'+e(l.categoria||'')+'</div>'
               + '<div style="font-size:10px;color:var(--t3)">'+e(l.segmento||'')+'</div>';
      canalHtml= (l.email ? '<div style="font-size:11px;color:var(--b)">&#9993; '+e(l.email)+'</div>' : '')
               + (l.telefone ? '<div style="font-size:11px;margin-top:2px">'+e(l.telefone)+'</div>' : '')
               + (!l.email&&!l.telefone ? '<span style="font-size:11px;color:var(--t3)">só LinkedIn</span>' : '');
    } else {
      nomeHtml = '<div style="font-weight:500;font-size:12px;line-height:1.3">'+e(l.empresa)+'</div>'
               + (l.endereco ? '<div style="font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">'+e(l.endereco)+'</div>' : '')
               + (l.gmaps_url ? '<a href="'+l.gmaps_url+'" target="_blank" style="font-size:10px;color:var(--t3)">&#128205; maps</a>' : '');
      catHtml  = '<div style="font-size:11px">'+e(l.categoria||'')+'</div>'
               + (l.num_avaliacoes ? '<div style="font-size:10px;color:var(--t3)">&#11088; '+l.avaliacao+' ('+l.num_avaliacoes+')</div>' : '');
      canalHtml= (waUrl && l.whatsapp==='SIM')
               ? '<a href="'+waUrl+'" target="_blank" style="font-size:11px;color:var(--g);font-weight:500">&#128241; '+e(l.telefone)+'</a>'
               : '<span style="font-size:11px">'+e(l.telefone||'—')+'</span>';
    }

    return '<tr class="'+(isMine?'mine':'')+'" id="row-'+l._id+'">'
      +'<td style="font-size:10px;color:var(--t3)">'+(start+idx+1)+'</td>'
      +'<td>'+nomeHtml+'</td>'
      +'<td>'+catHtml+'</td>'
      +'<td>'+canalHtml+'</td>'
      +'<td><select class="rsel '+(isMine?'mine':'')+'" onchange="onResp(''+l._id+'',this)">'+rOpts+'</select></td>'
      +'<td><div class="swrap"><button class="sbadge '+sc+'" onclick="toggleMenu(''+l._id+'',this)">'+sl+' <span class="arr">&#9662;</span></button>'
      +'<div class="smenu h" id="sm-'+l._id+'">'+STATUS.map(s=>'<button onclick="onStatus(''+l._id+'',''+s+'')">'+SLBL[s]+'</button>').join('')+'</div></div></td>'
      +'<td><textarea class="obs" rows="1" placeholder="Anotação…" onblur="onObs(''+l._id+'',this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.blur()}">'+e(l.observacoes||'')+'</textarea></td>'
      +'<td><div style="font-size:10px;color:var(--t3)">'+upd+'</div>'+updBy+'</td>'
      +'</tr>';
  }).join('');
  renderPag();
}

function renderStats() {
  const tot=leads.length, meu=leads.filter(l=>l.responsavel===sdr).length,
        con=leads.filter(l=>l.status==='contatando').length,
        ava=leads.filter(l=>l.status==='avançou').length,
        dec=leads.filter(l=>l.status==='declinou').length,
        liv=leads.filter(l=>!l.responsavel).length;
  ['tot','meu','con','ava','dec','liv'].forEach((k,i)=>sv('s-'+k,[tot,meu,con,ava,dec,liv][i].toLocaleString('pt-BR')));
}

function renderPag() {
  const pages=Math.ceil(filtered.length/PER), pag=document.getElementById('pag');
  if (pages<=1){pag.innerHTML='';return;}
  let h='<span class="pag-info">'+filtered.length.toLocaleString('pt-BR')+'</span>';
  h+='<button onclick="goP('+Math.max(1,page-1)+')" '+(page===1?'disabled':'')+'>&#8249;</button>';
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-page)<=2) h+='<button class="'+(i===page?'on':'')+'" onclick="goP('+i+')">'+i+'</button>';
    else if(Math.abs(i-page)===3) h+='<span class="pag-info">…</span>';
  }
  h+='<button onclick="goP('+Math.min(pages,page+1)+')" '+(page===pages?'disabled':'')+'>&#8250;</button>';
  pag.innerHTML=h;
}

function goP(p){page=p;renderTable();document.querySelector('.twrap')?.scrollIntoView({behavior:'smooth',block:'start'});}

function toggleMenu(id,btn){
  const m=document.getElementById('sm-'+id);
  if(openMenu&&openMenu!==m)openMenu.classList.add('h');
  m.classList.toggle('h');
  openMenu=m.classList.contains('h')?null:m;
}
document.addEventListener('click',e=>{if(openMenu&&!e.target.closest('.swrap')){openMenu.classList.add('h');openMenu=null;}});

async function onStatus(id,status){
  if(openMenu){openMenu.classList.add('h');openMenu=null;}
  const lead=leads.find(l=>l._id===id);
  const ch={status};
  if(status==='contatando'&&!lead?.responsavel) ch.responsavel=sdr;
  const ok=await updateLead(id,ch);
  if(ok) toast(SLBL[status]);
}

async function onResp(id,sel){
  const val=sel.value||null;
  const ok=await updateLead(id,{responsavel:val});
  if(!ok) sel.value=leads.find(l=>l._id===id)?.responsavel||'';
}

async function onObs(id,ta){await updateLead(id,{observacoes:ta.value});}

function buildCatFilter(){
  const cats=[...new Set(leads.map(l=>l.categoria).filter(Boolean))].sort();
  const sel=document.getElementById('f-ca'), cur=sel.value;
  sel.innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>'<option value="'+c+'" '+(c===cur?'selected':'')+'>'+c+'</option>').join('');
}

function toggleD(id){
  const b=document.getElementById('dbody-'+id), c=document.getElementById('chev-'+id);
  b.classList.toggle('open'); c.classList.toggle('open',b.classList.contains('open'));
}

function cpScript(btn){
  const pre=btn.nextElementSibling;
  navigator.clipboard.writeText(pre.textContent.trim()).then(()=>{
    const old=btn.textContent; btn.textContent='✓ copiado'; btn.style.color='var(--g)';
    setTimeout(()=>{btn.textContent=old;btn.style.color='';},2000);
  });
}

function showSdr(){
  pickedSDR=sdr;

  pick.innerHTML=SDRs.map(s=>'<button class="sdr-btn '+(s===sdr?'on':'')+'" onclick="pickSDR(''+s+'',this)">'+s+'</button>').join('');
  document.getElementById('btn-ok-sdr').disabled=!sdr;
  document.getElementById('ov-sdr').classList.remove('h');
}
function pickSDR(name,btn){
  pickedSDR=name;
  document.querySelectorAll('.sdr-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('btn-ok-sdr').disabled=false;
}
function confirmSdr(){
  if(!pickedSDR) return;
  sdr=pickedSDR; localStorage.setItem('sdr',sdr);

}

function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let _tt;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2500);}

function sv(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
